[tool.poetry]
name = "fastmcp-mcp-customtokenexchange-python"
version = "0.1.0"
description = "MCP server example with Auth0 Custom Token Exchange using auth0-ai-mcp"
authors = ["Auth0 <support@auth0.com>"]
readme = "README.md"
packages = [{include = "*", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
python-dotenv = "^1.1.1"
auth0-ai-mcp = { version = ">=1.0.0b0", extras = ["mcp"] }
auth0-api-python = ">=1.0.0b11"
starlette = ">=0.48.0"
uvicorn = ">=0.36.0"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "ruff (>=0.13.1,<0.14.0)"
]
