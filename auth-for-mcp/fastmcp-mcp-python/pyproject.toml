[tool.poetry]
name = "fastmcp-mcp-python"
version = "0.1.0"
description = "MCP server example secured with Auth0 using auth0-ai-mcp"
authors = ["Auth0 <support@auth0.com>"]
readme = "README.md"
packages = [{include = "*", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
python-dotenv = "^1.1.1"
auth0-ai-mcp = { version = ">=1.0.0b0", extras = ["mcp"] }
starlette = ">=0.48.0"
uvicorn = ">=0.36.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "ruff (>=0.13.1,<0.14.0)"
]
